<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Edge</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #1e293b;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        header p {
            margin-top: 10px;
            font-size: 1.2em;
            color: #cbd5e1;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .info-card {
            background: #f8fafc;
            padding: 15px;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
        }
        .info-card h3 {
            margin-top: 0;
            color: #1e293b;
        }
        .info-card a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
        .info-card a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Engineering Edge</h1>

    </header>

    <div class="container">
        <h2>የመገናኛ መረጃዎች (Contact Us)</h2>
        <div class="contact-info">
            <div class="info-card">

                <p><a href="tel:+251912871100">+251 912 871 100</a></p>
            </div>
            <div class="info-card">
                <h3>✉️ ኢሜይል</h3>
                <p><a href="mailto:lemas251@gmail.com">lemas251@gmail.com</a></p>
            </div>
            <div class="info-card">
                <h3>📍 የቢሮ አድራሻ</h3>
                <p>Addis Ababa, Ethiopia</p>

            <div class="info-card">

                <p><a href="https://t.me/Lem10tech" target="_blank">@Lem10tech</a></p>

</body>
</html>
